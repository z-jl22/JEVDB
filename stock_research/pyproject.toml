[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research"
version = "0.1.0"
description = "Peripheral stock research, multi-source ingestion, quant backtest, and paper-trading prototype for JEVDB"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.4.3",
    "akshare>=1.20.70",
    "yfinance>=1.8.0",
    "mcp>=2.3.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "ddgs>=9.16.1",
    "beautifulsoup4>=4.15.0",
    "trafilatura>=2.4.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "playwright>=1.65.2",
]

[tool.setuptools]
packages = [
    "stock_research",
    "stock_research.storage",
    "stock_research.storage.ingest",
]

[tool.setuptools.package-dir]
"stock_research" = "."

[tool.pytest.ini_options]
markers = [
    "live: marks tests that hit live external APIs (run with RUN_LIVE_TESTS=1)",
]
